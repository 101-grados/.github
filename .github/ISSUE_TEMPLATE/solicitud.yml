name: Solicitud de usuario
description: Un pedido o un problema que reportó alguien que usa el producto
type: Feature
projects: ["101-grados/1"]
body:
  - type: markdown
    attributes:
      value: |
        Cuando este issue se cierre, se avisa **por correo** a las personas de
        «Solicitado por». Si el pedido toca varios repos, este issue es el
        padre y cada repo recibe un sub-issue («Tarea técnica»); el padre se
        cierra solo cuando se cierra el último sub-issue.

  - type: input
    id: solicitado-por
    attributes:
      label: Solicitado por
      description: >
        Una o varias personas, separadas por coma. Usa el alias del directorio
        de la organización (`101-grados/gh-actions/requesters.json`) o el
        correo completo.
      placeholder: maria, juan, alguien@cliente.com
    validations:
      required: true

  - type: textarea
    id: pedido
    attributes:
      label: Qué pidió
      description: En sus palabras, tal como lo contó.
    validations:
      required: true

  - type: input
    id: donde
    attributes:
      label: Dónde ocurre
      placeholder: /management/pos-redemptions → diálogo "Crear premio nuevo"

  - type: textarea
    id: aviso
    attributes:
      label: Mensaje para el aviso
      description: >
        Lo que leerá la persona en el correo, en lenguaje de negocio. Se puede
        completar o cambiar hasta que se cierre el issue. Si queda vacío, el
        correo usa el título. Un comentario `/aviso <texto>` tiene prioridad.
      placeholder: Ya puedes escribir en el selector de sub-categorías para filtrarlas.
